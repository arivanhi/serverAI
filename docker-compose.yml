services:
  ollama:
    image: ollama/ollama:latest
    container_name: tremku_llm
    ports:
      - "11434:11434"
    volumes:
      - ~/.ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: tremku_memory
    ports:
      - "6333:6333"
    volumes:
      - ./qdrant_data:/qdrant/storage
    restart: unless-stopped

  emqx:
    image: emqx/emqx:latest
    container_name: tremku_telemetry
    environment:
      - EMQX_ALLOW_ANONYMOUS=true
      - EMQX_DASHBOARD__DEFAULT_USERNAME=admin
      - EMQX_DASHBOARD__DEFAULT_PASSWORD=public
    ports:
      - "1883:1883"
      - "8083:8083"
      - "18083:18083"
    volumes:
      - ./emqx_data:/opt/emqx/data
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: tremku_session
    ports:
      - "6379:6379"
    volumes:
      - ./redis_data:/data
    restart: unless-stopped
